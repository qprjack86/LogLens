name: Trigger auto deployment for fslogix-analyser

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/fslogix-analyser-AutoDeployTrigger-b38bcac0-120f-40a4-8478-18071e3c2e9e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FSLOGIXANALYSER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FSLOGIXANALYSER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FSLOGIXANALYSER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: kailicereg.azurecr.io
          registryUsername: ${{ secrets.FSLOGIXANALYSER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FSLOGIXANALYSER_REGISTRY_PASSWORD }}
          containerAppName: fslogix-analyser
          resourceGroup: rg-fslogix-tools
          imageToBuild: kailicereg.azurecr.io/fslogix-analyser:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


