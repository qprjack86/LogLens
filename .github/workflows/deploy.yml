name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # UPDATE THIS with the output from Phase 2 (e.g., ca3660...)
  ACR_NAME: "ca0a832c98ecacr" 
  RESOURCE_GROUP: "rg-fslogix-tools"
  CONTAINER_APP_NAME: "fslogix-analyser"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push to ACR
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build --registry ${{ env.ACR_NAME }} --image loglens:latest .

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/loglens:latest